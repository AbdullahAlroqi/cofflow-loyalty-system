<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة اختبار COFFLOW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .test-card { 
            background: linear-gradient(135deg, #8B4513, #D2691E);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">
                    <i class="fas fa-coffee"></i>
                    صفحة اختبار COFFLOW
                </h1>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <div class="test-card text-center">
                    <i class="fas fa-users fa-3x mb-3"></i>
                    <h3>15</h3>
                    <p>إجمالي العملاء</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="test-card text-center">
                    <i class="fas fa-ticket-alt fa-3x mb-3"></i>
                    <h3>5</h3>
                    <p>الكوبونات النشطة</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="test-card text-center">
                    <i class="fas fa-bell fa-3x mb-3"></i>
                    <h3>6</h3>
                    <p>الإشعارات</p>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-check-circle text-success"></i> اختبار المكونات</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">✅ النصوص العربية تظهر بشكل صحيح</li>
                            <li class="list-group-item">✅ الاتجاه من اليمين لليسار يعمل</li>
                            <li class="list-group-item">✅ Bootstrap يعمل بشكل صحيح</li>
                            <li class="list-group-item">✅ Font Awesome يعمل بشكل صحيح</li>
                            <li class="list-group-item">✅ الألوان والتدرجات تظهر</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
